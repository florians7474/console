<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Cracking</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .corps { flex:1 1 auto; display:flex; flex-direction:column; padding:14px 18px; overflow-y:auto; }
    .cible { font-size:13px; color:#8b949e; margin-bottom:12px; }
    .cible b { color:#e6edf3; }

    .journal { margin-bottom:10px; }
    .jline { font-size:12px; padding:3px 0; display:flex; gap:8px; align-items:center; }
    .jline .ico { width:16px; text-align:center; font-weight:700; }
    .jline.ok .ico { color:#2ea043; }
    .jline.no .ico { color:#8b949e; }
    .jline.skip .ico { color:#6e7681; }
    .jline .txt { color:#8b949e; }

    .stage { font-size:14px; font-weight:600; margin-bottom:8px; }
    .stage .num { color:#f0883e; }
    .bar { height:10px; background:#161b22; border:1px solid #30363d; border-radius:6px; overflow:hidden; margin-bottom:10px; }
    .bar i { display:block; height:100%; width:0; background:#f0883e; transition:width .4s; }
    .stats { display:flex; justify-content:space-between; font-size:11px; color:#8b949e; margin-bottom:12px; }
    .try { font-size:12px; color:#c9d1d9; font-family:ui-monospace,Consolas,monospace;
           background:#161b22; border:1px solid #30363d; border-radius:6px; padding:8px 10px;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .try span { color:#f0883e; }

    .fin { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .verdict { font-size:20px; font-weight:700; margin-bottom:10px; }
    .faible { color:#da3633; }
    .solide { color:#2ea043; }
    .detail { font-size:13px; color:#c9d1d9; line-height:1.6; max-width:360px; }
    .detail .cle { font-family:ui-monospace,Consolas,monospace; background:#161b22; border:1px solid #30363d; border-radius:6px; padding:2px 8px; }
    .stopbtn { display:block; margin:14px auto 0; border:1px solid #da3633; color:#da3633;
               background:none; border-radius:8px; padding:9px 20px; font-size:13px;
               font-weight:600; cursor:pointer; }
    .hide { display:none; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/mode/cassage">&larr;</a>
    <div class="titre">Cracking</div>
  </div>

  <div class="corps">
    <div class="cible">Network tested: <b>{{ c.nom }}</b> &middot; {{ c.bssid }}</div>

    <div id="live">
      <div class="journal" id="journal"></div>
      <div class="stage">Stage <span class="num"><b id="snum">1</b>/<b id="stot">1</b></span> — <span id="sname">starting…</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stats"><span id="tested">0 keys</span><span id="speed">0 k/s</span></div>
      <div class="try">testing: <span id="cand">…</span></div>
<button class="stopbtn" id="stopbtn" onclick="stopIt()">Stop</button>
    </div>

    <div id="fin" class="fin hide">
      <div class="verdict" id="verdict"></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>

  <script>
    function stopIt(){
      document.getElementById('stopbtn').textContent = 'Stopping…';
      fetch('/cassage/stop').catch(()=>{});
    }
    function fmt(n){ return n.toLocaleString('en-US'); }
    var timer = setInterval(tick, 1000);
    tick();
    function tick(){
      fetch('/cassage/etat').then(r=>r.json()).then(e=>{
        document.getElementById('snum').textContent = e.etape_num || 1;
        document.getElementById('stot').textContent = e.etape_total || 1;
        document.getElementById('sname').textContent = e.etape || 'starting…';
        document.getElementById('tested').textContent = fmt(e.testes||0) + ' keys';
        document.getElementById('speed').textContent = (e.vitesse||0) + ' k/s';
        document.getElementById('cand').textContent = e.candidat || '…';
        var pct = e.total ? Math.min(100, (e.testes/e.total)*100) : 0;
        document.getElementById('bar').style.width = pct + '%';

        var jl = e.journal || [];
        var jhtml = '';
        jl.forEach(function(s){
          var cls = s.resultat==='cracked' ? 'ok' : (s.resultat==='skipped' ? 'skip' : 'no');
          var ico = s.resultat==='cracked' ? '✓' : (s.resultat==='skipped' ? '⊘' : '✗');
          var lab = s.resultat==='cracked' ? 'cracked' : (s.resultat==='skipped' ? 'not applicable' : 'not found');
          jhtml += '<div class="jline '+cls+'"><span class="ico">'+ico+'</span><span class="txt">Stage '+s.num+': '+s.nom+' — '+lab+'</span></div>';
        });
        document.getElementById('journal').innerHTML = jhtml;

        if(e.fini){
          clearInterval(timer);
          document.getElementById('live').classList.add('hide');
          var fin = document.getElementById('fin');
          var v = document.getElementById('verdict');
          var d = document.getElementById('detail');
          fin.classList.remove('hide');
          if(e.trouve){
            v.textContent = 'WEAK key';
            v.className = 'verdict faible';
            d.innerHTML = 'Key found:<br><span class="cle">' + e.cle + '</span><br><br>This key falls to a dictionary. Change it to something long and random.';
          } else {
            v.textContent = 'Strong key';
            v.className = 'verdict solide';
            d.innerHTML = 'No key found after the local stages.<br>This router holds up well.';
          }
        }
      }).catch(()=>{});
    }
  </script>
</body>
</html>
