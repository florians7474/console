<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Réseaux autorisés</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .scan-btn {
      border:1px solid #2ea043; color:#2ea043; text-decoration:none; border-radius:8px;
      padding:7px 12px; font-size:13px; font-weight:600;
    }
    .liste { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
    .ligne {
      display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
      background:#161b22; border:1px solid #30363d; border-radius:10px;
    }
    .infos { flex:1; min-width:0; }
    .rnom { font-size:14px; font-weight:600; }
    .rbssid { font-size:11px; color:#8b949e; font-family:ui-monospace,Consolas,monospace; }
    .retirer { color:#da3633; text-decoration:none; font-size:20px; padding:2px 8px; }
    .vide { color:#8b949e; font-size:13px; text-align:center; margin-top:28px; line-height:1.6; }
    .ajout {
      flex:0 0 auto; display:flex; gap:8px; padding:10px 12px;
      background:#161b22; border-top:1px solid #30363d; align-items:center;
    }
    .ajout input {
      background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#e6edf3;
      padding:8px 10px; font-size:13px;
    }
    .ajout input[name="nom"] { width:120px; }
    .ajout input[name="bssid"] { flex:1; font-family:ui-monospace,Consolas,monospace; }
    .ajout button {
      border:none; border-radius:8px; background:#2ea043; color:#fff;
      font-size:13px; font-weight:600; padding:9px 14px; cursor:pointer;
    }
    .pied { flex:0 0 auto; text-align:center; padding:4px 0 8px; }
    .pied a { color:#8b949e; font-size:11px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/">&larr;</a>
    <div class="titre">Réseaux autorisés</div>
    <a class="scan-btn" href="/scan">Scanner</a>
  </div>

  <div class="liste">
    {% if reseaux %}
      {% for r in reseaux %}
      <div class="ligne">
        <div class="infos">
          <div class="rnom">{{ r.nom }}</div>
          <div class="rbssid">{{ r.bssid }}</div>
        </div>
        <a class="retirer" href="/liste/retirer/{{ r.bssid }}" title="Retirer">&times;</a>
      </div>
      {% endfor %}
    {% else %}
      <div class="vide">Aucun réseau autorisé pour l'instant.<br>Scanne, ou ajoute ta box ci-dessous.</div>
    {% endif %}
  </div>

  <form class="ajout" method="post" action="/liste/ajouter">
    <input type="text" name="nom" placeholder="Nom (ex: Maison)">
    <input type="text" name="bssid" placeholder="AA:BB:CC:DD:EE:FF" required>
    <button type="submit">Ajouter</button>
  </form>

  <div class="pied">
    <a href="/liste/reset" onclick="return confirm('Tout effacer ?')">Tout effacer</a>
  </div>

  <script>
    (function(){
      var liste = document.querySelector('.liste');
      if(!liste) return;
      var key = 'scroll:' + location.pathname;
      try { var y = sessionStorage.getItem(key); if (y !== null) liste.scrollTop = parseInt(y,10); } catch(e){}
      liste.addEventListener('click', function(e){
        if(!e.target.closest('a,button')) return;
        try { sessionStorage.setItem(key, liste.scrollTop); } catch(e){}
      });
    })();
  </script>
</body>
</html>
