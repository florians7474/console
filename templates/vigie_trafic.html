<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Traffic</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 6px; }
    .titre { font-size:15px; font-weight:700; flex:1; }
    .aide { flex:0 0 auto; font-size:11px; color:#8b949e; padding:8px 14px; background:#10151c; }
    .liste { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
    .dom {
      display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:7px;
      background:#161b22; border:1px solid #30363d; border-radius:9px;
      font-family:ui-monospace,Consolas,monospace; font-size:13px;
    }
    .pt { width:7px; height:7px; border-radius:50%; background:#28c0d4; }
    .note { flex:0 0 auto; font-size:11px; color:#8b949e; padding:9px 14px; background:#10151c; border-top:1px solid #30363d; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/vigie">&larr;</a>
    <div class="titre">{{ a.nom }}</div>
  </div>

  <div class="aide">Recently contacted domains</div>

  <div class="liste">
    {% for d in a.trafic %}
    <div class="dom"><span class="pt"></span>{{ d }}</div>
    {% endfor %}
  </div>

  <div class="note">Only domains are visible. HTTPS encrypts page content.</div>
</body>
</html>
