<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Device</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .type { flex:0 0 auto; font-size:11px; font-weight:600; color:#28c0d4;
            border:1px solid #1d5663; background:#10303a; border-radius:20px; padding:4px 10px; }
    .corps { flex:1 1 auto; overflow-y:auto; padding:12px 14px; }
    .fiche { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:10px 12px; margin-bottom:12px; }
    .champ { display:flex; justify-content:space-between; gap:12px; font-size:12px; padding:4px 0; }
    .champ .k { color:#8b949e; }
    .champ .v { font-family:ui-monospace,Consolas,monospace; text-align:right; word-break:break-all; }
    .sect { font-size:12px; color:#8b949e; font-weight:600; margin:2px 2px 8px; text-transform:uppercase; letter-spacing:.4px; }
    .port { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:6px;
            background:#161b22; border:1px solid #30363d; border-radius:8px; }
    .port .num { font-family:ui-monospace,Consolas,monospace; font-weight:700; color:#f0883e; min-width:52px; }
    .port .svc { font-size:13px; }
    .vide { color:#8b949e; font-size:12px; padding:8px 2px; }

    .scanning { display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px 0; }
    .radar { width:72px; height:72px; border-radius:50%; position:relative;
             background:
               radial-gradient(circle, transparent 0 2px, #1b2b2e 2px 3px, transparent 3px) center/24px 24px,
               #10191b;
             border:1px solid #1d5663; overflow:hidden; }
    .radar::after { content:""; position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(from 0deg, rgba(240,136,62,.55), rgba(240,136,62,0) 70%);
      animation:sweep 1.3s linear infinite; }
    @keyframes sweep { to { transform:rotate(360deg); } }
    .scanning .txt { font-size:12px; color:#8b949e; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/vigie">&larr;</a>
    <div class="titre">{{ d.nom }}</div>
    <span class="type" id="type">…</span>
  </div>

  <div class="corps">
    <div class="fiche">
      <div class="champ"><span class="k">IP</span><span class="v">{{ d.ip }}</span></div>
      {% if d.mac %}<div class="champ"><span class="k">MAC</span><span class="v">{{ d.mac }}</span></div>{% endif %}
      {% if d.vendor %}<div class="champ"><span class="k">Vendor</span><span class="v">{{ d.vendor }}</span></div>{% endif %}
      <div class="champ" id="champ-hote" style="display:none"><span class="k">Hostname</span><span class="v" id="hote"></span></div>
      <div class="champ"><span class="k">Status</span><span class="v">
        {%- if d.pi -%}This Pi{%- elif d.routeur -%}Router{%- elif d.mien -%}Mine{%- else -%}Unknown{%- endif -%}
      </span></div>
    </div>

    <div class="sect">Open ports (common)</div>
    <div id="ports">
      <div class="scanning"><div class="radar"></div><div class="txt">Scanning ports…</div></div>
    </div>
  </div>

  <script>
    var IP = {{ d.ip|tojson }};
    fetch('/vigie/ports/' + IP).then(function(r){ return r.json(); }).then(function(j){
      var t = document.getElementById('type'); t.textContent = j.type || 'Unknown';
      if(j.hote){
        document.getElementById('hote').textContent = j.hote;
        document.getElementById('champ-hote').style.display = '';
      }
      var box = document.getElementById('ports');
      var ports = j.ports || [];
      if(!ports.length){
        box.innerHTML = '<div class="vide">No open port found. The device may be firewalled, asleep, or expose nothing.</div>';
        return;
      }
      box.innerHTML = '';
      ports.forEach(function(p){
        var d = document.createElement('div'); d.className = 'port';
        var n = document.createElement('span'); n.className = 'num'; n.textContent = p.port;
        var s = document.createElement('span'); s.className = 'svc'; s.textContent = p.service;
        d.appendChild(n); d.appendChild(s); box.appendChild(d);
      });
    }).catch(function(){
      document.getElementById('type').textContent = '';
      document.getElementById('ports').innerHTML = '<div class="vide">Port scan failed.</div>';
    });
  </script>
</body>
</html>
