<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Scan</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .onglets { flex:0 0 auto; display:flex; background:#0d1117; border-bottom:1px solid #30363d; }
    .onglets a {
      flex:1; text-align:center; padding:10px 6px; font-size:12px; font-weight:600;
      color:#8b949e; text-decoration:none; border-bottom:2px solid transparent;
    }
    .onglets a.actif { color:#e6edf3; border-bottom-color:#2ea043; }
    .liste { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
    .ligne {
      display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
      background:#161b22; border:1px solid #30363d; border-radius:10px;
    }
    .infos { flex:1; min-width:0; }
    .rnom { font-size:14px; font-weight:600; }
    .rbssid { font-size:11px; color:#8b949e; font-family:ui-monospace,Consolas,monospace; }
    .sig { font-size:11px; color:#8b949e; margin-right:4px; white-space:nowrap; }
    .plus {
      border:none; border-radius:8px; background:#2ea043; color:#fff;
      font-size:20px; font-weight:700; width:34px; height:34px; cursor:pointer; line-height:1;
    }
    .deja { color:#2ea043; font-size:18px; width:34px; text-align:center; }
    .pied { flex:0 0 auto; text-align:center; padding:4px 0 8px; }
    .pied a { color:#8b949e; font-size:11px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/liste">&larr;</a>
    <div class="titre">Detected networks</div>
  </div>

  <div class="onglets">
    <a href="/scan?source=direct" class="{{ 'actif' if source=='direct' }}">Direct scan</a>
    <a href="/scan?source=pwna" class="{{ 'actif' if source=='pwna' }}">Spotted by Pwnagotchi</a>
  </div>

  <div class="liste">
    {% for r in reseaux %}
    <div class="ligne">
      <div class="infos">
        <div class="rnom">{{ r.nom }}</div>
        <div class="rbssid">{{ r.bssid }}</div>
      </div>
      {% if r.signal is defined and r.signal is not none %}<span class="sig">{{ r.signal }} dBm</span>{% endif %}
      {% if r.bssid in deja %}
        <span class="deja" title="Already allowed">&check;</span>
      {% else %}
        <form method="post" action="/liste/ajouter">
          <input type="hidden" name="nom" value="{{ r.nom }}">
          <input type="hidden" name="bssid" value="{{ r.bssid }}">
          <input type="hidden" name="retour" value="scan">
          <input type="hidden" name="source" value="{{ source }}">
          <button class="plus" type="submit" title="Add to whitelist">+</button>
        </form>
      {% endif %}
    </div>
    {% endfor %}
  </div>

  <div class="pied">
    <a href="/liste/reset?source={{ source }}" onclick="return confirm('Clear everything?')">Clear all</a>
  </div>

  <script>
    (function(){
      var liste = document.querySelector('.liste');
      if(!liste) return;
      var key = 'scroll:' + location.pathname;
      try { var y = sessionStorage.getItem(key); if (y !== null) liste.scrollTop = parseInt(y,10); } catch(e){}
      liste.addEventListener('click', function(e){
        if(!e.target.closest('a,button')) return;
        try { sessionStorage.setItem(key, liste.scrollTop); } catch(e){}
      });
    })();
  </script>
</body>
</html>
