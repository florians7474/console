<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Fennec</title>
  <link rel="icon" type="image/svg+xml" href="/static/fennec.svg">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden; position:relative;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(130% 130% at 50% 0%, #1b2330 0%, #0d1117 60%);
      color:#e6edf3; display:flex; flex-direction:column;
    }

    .splash {
      position:absolute; inset:0; z-index:50;
      background:radial-gradient(130% 130% at 50% 40%, #1b2330 0%, #0d1117 65%);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      animation:boot 2s ease forwards;
    }
    .splash img { width:140px; animation:pop .6s ease both; }
    .splash .marque { font-size:30px; font-weight:800; letter-spacing:3px; }
    @keyframes boot { 0%,55%{opacity:1;visibility:visible;} 100%{opacity:0;visibility:hidden;} }
    @keyframes pop { 0%{transform:scale(.6);opacity:0;} 100%{transform:scale(1);opacity:1;} }

    .entete { height:48px; flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:0 14px; }
    .entete img { width:30px; height:30px; }
    .entete .marque { font-size:18px; font-weight:700; letter-spacing:.5px; }
    .entete .sp { flex:1; }
    .reglages { padding:6px; opacity:.75; }
    .reglages:active { opacity:1; }
    .reglages svg { width:23px; height:23px; display:block; }

    .grille { flex:1 1 auto; display:grid; grid-template-columns:repeat(2,116px); gap:12px 44px; place-content:center; }
    .app { display:flex; flex-direction:column; align-items:center; text-decoration:none; width:116px; color:#e6edf3; }
    .icone {
      width:80px; height:80px; border-radius:21px; display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
      transition:transform .12s ease; position:relative; overflow:hidden;
    }
    .icone::after { content:""; position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%); pointer-events:none; }
    .app:active .icone { transform:scale(.92); }
    .app.on .icone { box-shadow:0 0 0 3px #2ea043, 0 8px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28); }
    .icone img { width:60px; height:60px; object-fit:contain; z-index:1; }
    .pwn   { background:linear-gradient(150deg,#19e38c,#0a7d4e); }
    .cass  { background:linear-gradient(150deg,#ffb020,#e86a0a); }
    .bjorn { background:linear-gradient(150deg,#6f9bc8,#33506f); }
    .carte { background:linear-gradient(150deg,#8b5cf6,#5b2fd6); }
    .carte svg { width:42px; height:42px; z-index:1; }
    .nom { margin-top:8px; font-size:12px; font-weight:600; color:#e6edf3; }
    .etat { display:flex; align-items:center; gap:5px; margin-top:3px; font-size:10px; color:#8b949e; }
    .pastille { width:6px; height:6px; border-radius:50%; background:#5a6673; }
    .on .pastille { background:#2ea043; box-shadow:0 0 6px #2ea043; }
    .on .etat { color:#2ea043; }
  </style>
</head>
<body>

  <div class="splash">
    <img src="/static/fennec.svg" alt="Fennec">
    <div class="marque">FENNEC</div>
  </div>

  <div class="entete">
    <img src="/static/fennec.svg" alt="">
    <div class="marque">Fennec</div>
    <div class="sp"></div>
    <a class="reglages" href="/liste" title="Réseaux autorisés">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </div>

  <div class="grille">

    <a class="app {{ 'on' if actif=='pwnagotchi' }}" href="/mode/pwnagotchi">
      <div class="icone pwn"><img src="/static/pwnagotchi.png" alt="Pwnagotchi"></div>
      <div class="nom">Pwnagotchi</div>
      <div class="etat"><span class="pastille"></span>{{ 'actif' if actif=='pwnagotchi' else 'arrêté' }}</div>
    </a>

    <a class="app {{ 'on' if actif=='cassage' }}" href="/mode/cassage">
      <div class="icone cass"><img src="/static/raton.svg" alt="Raton"></div>
      <div class="nom">Raton</div>
      <div class="etat"><span class="pastille"></span>{{ 'actif' if actif=='cassage' else 'arrêté' }}</div>
    </a>

    <a class="app {{ 'on' if actif=='bjorn' }}" href="/mode/bjorn">
      <div class="icone bjorn"><img src="/static/bjorn.png" alt="Bjorn"></div>
      <div class="nom">Bjorn</div>
      <div class="etat"><span class="pastille"></span>{{ 'actif' if actif=='bjorn' else 'arrêté' }}</div>
    </a>

    <a class="app" href="/carte">
      <div class="icone carte">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div class="nom">Carte</div>
      <div class="etat"><span class="pastille"></span>réseaux</div>
    </a>

  </div>
</body>
</html>
