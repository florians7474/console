<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Console</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:480px; height:320px; background:#0d1117; font-family:system-ui,sans-serif; overflow:hidden; }
    .grille { display:flex; height:100%; gap:4px; padding:4px; }
    .tuile { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:#161b22; border:1px solid #30363d; border-radius:12px; color:#e6edf3;
             text-decoration:none; }
    .tuile:active { background:#21262d; }
    .icone { font-size:46px; margin-bottom:10px; }
    .nom { font-size:17px; font-weight:600; }
    .etat { font-size:12px; color:#8b949e; margin-top:6px; }
    .actif { border-color:#2ea043; }
    .actif .etat { color:#2ea043; }
  </style>
</head>
<body>
  <div class="grille">
    <a class="tuile {{ 'actif' if actif=='pwnagotchi' }}" href="/pwnagotchi">
      <div class="icone">&#128225;</div>
      <div class="nom">Pwnagotchi</div>
      <div class="etat">{{ 'actif' if actif=='pwnagotchi' else 'arrete' }}</div>
    </a>
    <a class="tuile {{ 'actif' if actif=='cassage' }}" href="/cassage">
      <div class="icone">&#128273;</div>
      <div class="nom">Cassage</div>
      <div class="etat">{{ 'actif' if actif=='cassage' else 'arrete' }}</div>
    </a>
    <a class="tuile {{ 'actif' if actif=='bjorn' }}" href="/bjorn">
      <div class="icone">&#9876;</div>
      <div class="nom">Bjorn</div>
      <div class="etat">{{ 'actif' if actif=='bjorn' else 'arrete' }}</div>
    </a>
  </div>
</body>
</html>
